databaseChangeLog:
  - changeSet:
      id: 002-create-archive-inbox-message
      author: Alexey Rabuev
      changes:
        - createTable:
            tableName: archive_inbox_message
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_archive_inbox_message

              - column:
                  name: topic
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: kafka_partition
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: kafka_offset
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: message_key
                  type: TEXT

              - column:
                  name: event_id
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: event_time
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: produced_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: error_message
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: created_by
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: updated_by
                  type: TEXT
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_archive_inbox_message_status
            tableName: archive_inbox_message
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_archive_inbox_message_event_id
            tableName: archive_inbox_message
            columns:
              - column:
                  name: event_id

        - createIndex:
            indexName: idx_archive_inbox_message_created_at
            tableName: archive_inbox_message
            columns:
              - column:
                  name: created_at