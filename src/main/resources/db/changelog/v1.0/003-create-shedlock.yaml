databaseChangeLog:
  - changeSet:
      id: 003-create-shedlock
      author: Alexey Rabuev
      changes:
        - createTable:
            tableName: shedlock
            columns:
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_shedlock

              - column:
                  name: lock_until
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: locked_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: locked_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false